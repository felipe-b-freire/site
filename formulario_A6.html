<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<h1>Candidate-se</h1>
<body>
    <h2>Preencha o formulário para se candidatar.</h2>

    <section>

        <form action="" id="form" name="form">
            <label for="nome">Nome: </label>
            <input type="text" name="nome" id="nome" required> <br>

            <label for="email">E-mail: </label>
            <input type="email" name="email" id="email" required> <br>
            
            <label for="idade">Idade: </label>
            <input type="number" name="idade" id="idade" required> <br>

            <label for="materia">Matéria: </label>
            <select name="materia" id="materia" required>
                <option value="" disabled selected hidden>Selecione uma opção</option>
                <option value="matematica">Matemática</option>
                <option value="portugues">Português</option>
                <option value="biologia">Biologioa</option>
                <option value="ciencias">Ciências</option>
                <option value="historia">História</option>
                <option value="geografia">Geografia</option>
                <option value="artes">Artes</option>
            </select> <br>

            <label for="escolaridade">Escolaridade</label>
                <select name="escol" id="escol" required>
                    <option value="" disabled selected hidden>Selecione uma opção</option>
                    <option value="sup_completo">Superior completo</option>
                    <option value="cur_mest">Cursando Mestrado</option>
                    <option value="mest">Mestrado Completo</option>
                    <option value="cur_dout">Cursando Doutorado</option>
                    <option value="dout">Doutorado Completo</option>
                </select> <br> 

                <label for="descricao"">Descrição sobre si</label>
                <textarea name="descricao" id="descricao" cols="20" rows="5" minlength="200" required></textarea> <br>

                <input type="submit" value="Enviar mensagem" name="" id="">

        </form>

    </section>
    
</body>
</html>
